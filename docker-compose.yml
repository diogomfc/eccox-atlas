services:
  postgres:
    image: postgres:16-alpine
    container_name: eccox-atlas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas-dev
      POSTGRES_DB: eccox_atlas
    ports:
      - "5435:5432"
    volumes:
      - atlas-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d eccox_atlas"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  atlas-pgdata:
